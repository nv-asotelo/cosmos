<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="svgtitle svgdesc">
  <title id="svgtitle">Public headless explainable palletizer workflow</title>
  <desc id="svgdesc">Box images and metadata are sent through a headless client to a standalone Cosmos3 Reasoner endpoint. The client saves the raw response, reasoning trace, structured plan, and request summary for review.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#76b900"/>
    </marker>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#171717" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="520" fill="#080808"/>
  <rect width="1200" height="520" fill="url(#grid)"/>

  <text x="72" y="50" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" fill="#ffffff">Explainable Palletizer</text>
  <text x="72" y="84" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#76b900">Public headless Cosmos3 Reasoner flow</text>

  <rect x="70" y="145" width="240" height="170" rx="8" fill="#121212" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="92" y="180" font-family="'JetBrains Mono',Courier,monospace" font-size="12" fill="#76b900" letter-spacing="2">INPUTS</text>
  <text x="92" y="215" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#ffffff">Images + manifest</text>
  <text x="92" y="248" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#cccccc">Box images</text>
  <text x="92" y="271" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#cccccc">Weights and dimensions</text>
  <text x="92" y="294" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#cccccc">Pallet state and notes</text>

  <rect x="380" y="145" width="240" height="170" rx="8" fill="rgba(118,185,0,0.08)" stroke="#76b900" stroke-width="2"/>
  <text x="402" y="180" font-family="'JetBrains Mono',Courier,monospace" font-size="12" fill="#76b900" letter-spacing="2">CLIENT</text>
  <text x="402" y="215" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#ffffff">Headless runner</text>
  <text x="402" y="248" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#cccccc">Builds multimodal prompt</text>
  <text x="402" y="271" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#cccccc">Calls chat completions</text>
  <text x="402" y="294" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#cccccc">Parses JSON response</text>

  <rect x="690" y="145" width="240" height="170" rx="8" fill="rgba(118,185,0,0.08)" stroke="#76b900" stroke-width="2"/>
  <text x="712" y="180" font-family="'JetBrains Mono',Courier,monospace" font-size="12" fill="#76b900" letter-spacing="2">:8200 /v1</text>
  <text x="712" y="215" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#ffffff">Cosmos3 Reasoner</text>
  <text x="712" y="248" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#cccccc">vLLM or NIM endpoint</text>
  <text x="712" y="271" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#cccccc">OpenAI-compatible API</text>
  <text x="712" y="294" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#cccccc">Reasoning + action JSON</text>

  <rect x="960" y="145" width="170" height="170" rx="8" fill="#121212" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="982" y="180" font-family="'JetBrains Mono',Courier,monospace" font-size="12" fill="#76b900" letter-spacing="2">OUTPUTS</text>
  <text x="982" y="215" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#ffffff">Artifacts</text>
  <text x="982" y="248" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#cccccc">raw_response.txt</text>
  <text x="982" y="271" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#cccccc">reasoning_trace.txt</text>
  <text x="982" y="294" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#cccccc">plan.json</text>

  <line x1="312" y1="230" x2="376" y2="230" stroke="#76b900" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="622" y1="230" x2="686" y2="230" stroke="#76b900" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="932" y1="230" x2="956" y2="230" stroke="#76b900" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="70" y="380" width="1060" height="72" rx="8" fill="#101010" stroke="#252525" stroke-width="1"/>
  <text x="92" y="410" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#ffffff">Historical note</text>
  <text x="92" y="435" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#bdbdbd">The original inference-server was vLLM serving Cosmos Reason 2. It is not a drop-in Cosmos3 backend; this recipe uses a standalone Cosmos3 Reasoner endpoint.</text>
</svg>
