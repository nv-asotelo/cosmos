<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">Cosmos3 explainable palletizer workflow</title>
  <desc id="desc">Images and manifests pass through a prompt client to a Cosmos3 Reasoner endpoint. The client saves reasoning, action JSON, and review artifacts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#76b900"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .subtitle { font: 16px Arial, Helvetica, sans-serif; fill: #b8c1d1; }
      .box { fill: #172033; stroke: #334155; stroke-width: 2; rx: 16; }
      .boxAccent { fill: #0f172a; stroke: #76b900; stroke-width: 2; rx: 16; }
      .label { font: 700 20px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .small { font: 14px Arial, Helvetica, sans-serif; fill: #cbd5e1; }
      .tag { font: 12px Arial, Helvetica, sans-serif; fill: #101827; }
      .tagBg { fill: #76b900; rx: 10; }
      .line { stroke: #76b900; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="980" height="520" fill="url(#bg)"/>
  <text x="48" y="60" class="title">Explainable Mixed-SKU Palletizer</text>
  <text x="48" y="88" class="subtitle">Public Cosmos3 Reasoner recipe: headless by default, review UI optional</text>

  <g transform="translate(48 150)">
    <rect class="box" width="190" height="170"/>
    <rect x="20" y="22" width="54" height="42" rx="6" fill="#e5e7eb"/>
    <rect x="84" y="22" width="54" height="42" rx="6" fill="#f4ead7"/>
    <rect x="116" y="76" width="54" height="42" rx="6" fill="#dbeafe"/>
    <text x="20" y="136" class="label">Inputs</text>
    <text x="20" y="158" class="small">images + manifest</text>
  </g>

  <path class="line" d="M250 235 C290 235 300 235 338 235"/>

  <g transform="translate(350 150)">
    <rect class="box" width="220" height="170"/>
    <rect x="24" y="24" width="172" height="20" class="tagBg"/>
    <text x="38" y="39" class="tag">standard-library runner</text>
    <text x="24" y="78" class="label">Prompt Client</text>
    <text x="24" y="104" class="small">build request</text>
    <text x="24" y="126" class="small">bound output budget</text>
    <text x="24" y="148" class="small">validate JSON</text>
  </g>

  <path class="line" d="M582 235 C620 235 632 235 670 235"/>

  <g transform="translate(682 150)">
    <rect class="boxAccent" width="250" height="170"/>
    <text x="26" y="72" class="label">Cosmos3 Reasoner</text>
    <text x="26" y="100" class="small">Nano on port 8200 by default</text>
    <text x="26" y="122" class="small">Super for higher-quality review</text>
    <text x="26" y="144" class="small">/v1/chat/completions</text>
  </g>

  <path class="line" d="M570 330 C570 385 510 396 486 396"/>

  <g transform="translate(230 360)">
    <rect class="box" width="520" height="110"/>
    <text x="28" y="42" class="label">Artifacts And Review</text>
    <text x="28" y="70" class="small">raw_response.txt, reasoning_trace.txt, plan.json, request_summary.json</text>
    <text x="28" y="92" class="small">optional static review UI from saved files</text>
  </g>
</svg>
